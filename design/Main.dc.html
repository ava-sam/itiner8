<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ITINER8 — Dashboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @font-face {
    font-family: 'Bootzy TM';
    src: url(/_blob/afcec1789354dbbaae01f4e3833c4a61) format('truetype');
    font-weight: normal;
    font-style: normal;
  }
  @font-face {
    font-family: 'Alte Haas Grotesk';
    src: url(/_blob/0e03efa64b23e1152a5a6c722558da45) format('truetype');
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: 'Alte Haas Grotesk';
    src: url(/_blob/7041714b6f55833bdc6f4e2ea9ffa4a6) format('truetype');
    font-weight: 700;
    font-style: normal;
  }
  body { margin: 0; background: #e7e8e4; }
  .bg-photo {
    background-image: url(/_blob/4da3b25ed6ecd615f355ba729d70c61a);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  .label-grotesk {
    font-family: 'Alte Haas Grotesk', 'Helvetica Neue', Arial, sans-serif;
    text-transform: uppercase;
  }
  .title-display {
    font-family: 'Bootzy TM', 'Arial Narrow', sans-serif;
    text-transform: uppercase;
  }
  .tab-label {
    font-size: 22px;
    letter-spacing: 0.08em;
    font-weight: 700;
    -webkit-text-stroke: 0.5px currentColor;
    color: #18202b;
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    transform: translateY(-45%);
    text-align: center;
  }

  .folder { all: unset; cursor: pointer; display: block; position: absolute; transition: transform 160ms ease; }
  .folder:hover, .folder:focus-visible { transform: translateY(-10px); }
  .folder:focus-visible .folder-band { outline: 3px solid #18202b; outline-offset: -6px; }
</style>
</helmet>

<div class="bg-photo" style="width: 1440px; height: 900px; box-sizing: border-box; position: relative; overflow: hidden; color: #18202b; background-color: #e7e8e4;">

  <!-- header -->
  <div class="title-display" style="position:absolute; top:26px; left:64px; font-size:68px; letter-spacing:calc(0.01em + 2px); line-height:1;">
    ITINER8
  </div>
  <div class="label-grotesk" style="position:absolute; top:56px; right:64px; font-weight:400; font-size:18px; letter-spacing:calc(0.1em - 2px); color:#18202b;">
    WELCOME BACK, {{usernameUpper}}
  </div>
  <div style="position:absolute; top:112px; left:64px; right:64px; height:1px; background:rgba(24,32,43,0.28);"></div>

  <!-- view plans -->
  <button type="button" class="folder" style="left:64px; right:64px; top:140px; z-index:1;" onClick="{{goView}}">
    <div style="position:absolute; left:0; top:0; width:300px; height:60px;">
      <svg viewBox="0 0 300 60" preserveAspectRatio="none" style="position:absolute; inset:0; width:100%; height:100%;">
        <defs><clipPath id="clip-view"><path d="M27.1,12.2 Q34,0 48,0 L252,0 Q266,0 272.9,12.2 L300,60 L0,60 Z"/></clipPath></defs>
        <path d="M27.1,12.2 Q34,0 48,0 L252,0 Q266,0 272.9,12.2 L300,60 L0,60 Z" fill="#d3dff2" stroke="none"/>
        <image href="/_blob/789edfde02fbcf9388665e3592795353" x="0" y="0" width="300" height="60" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip-view)" style="mix-blend-mode:multiply; opacity:0.45;"/>
        <path d="M0,60 L27.1,12.2 Q34,0 48,0 L252,0 Q266,0 272.9,12.2 L300,60" fill="none" stroke="#18202b" stroke-width="3"/>
      </svg>
      <span class="label-grotesk tab-label">view plans</span>
    </div>
    <div class="folder-band" style="position:absolute; left:0; right:0; top:59px; height:124px; border:3px solid #18202b; border-bottom:none; overflow:hidden; background:#d3dff2;">
      <div style="position:absolute; inset:0; background-image:url(/_blob/789edfde02fbcf9388665e3592795353); background-size:cover; background-position:center; mix-blend-mode:multiply; opacity:0.45; pointer-events:none;"></div>
    </div>
  </button>

  <!-- join a plan -->
  <button type="button" class="folder" style="left:64px; right:64px; top:239px; z-index:2;" onClick="{{goJoin}}">
    <div style="position:absolute; left:360px; top:0; width:300px; height:60px;">
      <svg viewBox="0 0 300 60" preserveAspectRatio="none" style="position:absolute; inset:0; width:100%; height:100%;">
        <defs><clipPath id="clip-join"><path d="M27.1,12.2 Q34,0 48,0 L252,0 Q266,0 272.9,12.2 L300,60 L0,60 Z"/></clipPath></defs>
        <path d="M27.1,12.2 Q34,0 48,0 L252,0 Q266,0 272.9,12.2 L300,60 L0,60 Z" fill="#b1b2ae" stroke="none"/>
        <image href="/_blob/abb225e5637fe5a093dd2b5d858efc97" x="0" y="0" width="300" height="60" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip-join)" style="mix-blend-mode:multiply; opacity:0.5;"/>
        <path d="M0,60 L27.1,12.2 Q34,0 48,0 L252,0 Q266,0 272.9,12.2 L300,60" fill="none" stroke="#18202b" stroke-width="3"/>
      </svg>
      <span class="label-grotesk tab-label">join a plan</span>
    </div>
    <div class="folder-band" style="position:absolute; left:0; right:0; top:59px; height:124px; border:3px solid #18202b; border-bottom:none; overflow:hidden; background:#b1b2ae;">
      <div style="position:absolute; inset:0; background-image:url(/_blob/abb225e5637fe5a093dd2b5d858efc97); background-size:cover; background-position:center; mix-blend-mode:multiply; opacity:0.5; pointer-events:none;"></div>
    </div>
  </button>

  <!-- create a plan (dominant) -->
  <button type="button" class="folder" style="left:64px; right:64px; top:338px; bottom:24px; z-index:3;" onClick="{{goCreate}}">
    <div style="position:absolute; left:720px; top:0; width:300px; height:60px;">
      <svg viewBox="0 0 300 60" preserveAspectRatio="none" style="position:absolute; inset:0; width:100%; height:100%;">
        <defs><clipPath id="clip-create"><path d="M27.1,12.2 Q34,0 48,0 L252,0 Q266,0 272.9,12.2 L300,60 L0,60 Z"/></clipPath></defs>
        <path d="M27.1,12.2 Q34,0 48,0 L252,0 Q266,0 272.9,12.2 L300,60 L0,60 Z" fill="#93a4c1" stroke="none"/>
        <image href="/_blob/7d9578fff3a6cef375d680cad3b1e797" x="0" y="0" width="300" height="60" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip-create)" style="mix-blend-mode:multiply; opacity:0.22;"/>
        <path d="M0,60 L27.1,12.2 Q34,0 48,0 L252,0 Q266,0 272.9,12.2 L300,60" fill="none" stroke="#18202b" stroke-width="3"/>
      </svg>
      <span class="label-grotesk tab-label">create a plan</span>
    </div>
    <div class="folder-band" style="position:absolute; left:0; right:0; top:59px; bottom:-24px; border:3px solid #18202b; overflow:hidden; background:#93a4c1;">
      <div style="position:absolute; inset:0; background-image:url(/_blob/7d9578fff3a6cef375d680cad3b1e797); background-size:cover; background-position:center; mix-blend-mode:multiply; opacity:0.22; pointer-events:none;"></div>
    </div>
  </button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"username":{"editor":"text","default":"Ava"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const username = this.props.username ?? 'Ava';
    return {
      usernameUpper: username.toUpperCase(),
      goCreate: () => {},
      goView: () => {},
      goJoin: () => {}
    };
  }
}
</script>
</body>
</html>
